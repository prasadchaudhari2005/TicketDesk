<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketDesk | Fast Ticket Management</title>
  <meta name="description" content="Simple, fast, and elegant Ticket Management System powered by FastAPI and UV">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path>
            <path d="M13 5v2"></path>
            <path d="M13 17v2"></path>
            <path d="M13 11v2"></path>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">TicketDesk</h1>
          <p class="brand-subtitle">FastAPI & UV Ticket Management</p>
        </div>
      </div>
      <div class="header-actions">
        <a href="/docs" target="_blank" class="btn btn-secondary btn-sm" id="api-docs-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
            <path d="M6 6h10M6 10h10"></path>
          </svg>
          Swagger Docs
        </a>
        <button class="btn btn-primary" id="open-modal-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Create Ticket
        </button>
      </div>
    </header>

    <!-- Stats Bar -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">Total Tickets</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat-icon icon-blue">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">Urgent / High</span>
          <span class="stat-value" id="stat-urgent">0</span>
        </div>
        <div class="stat-icon icon-red">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">Medium Priority</span>
          <span class="stat-value" id="stat-medium">0</span>
        </div>
        <div class="stat-icon icon-amber">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">Low Priority</span>
          <span class="stat-value" id="stat-low">0</span>
        </div>
        <div class="stat-icon icon-green">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
      </div>
    </section>

    <!-- Controls / Filters -->
    <section class="controls-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search tickets by title, submitter, description..." />
      </div>

      <div class="filter-group">
        <select id="priority-filter" class="select-input">
          <option value="ALL">All Priorities</option>
          <option value="Urgent">Urgent</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
        <select id="category-filter" class="select-input">
          <option value="ALL">All Categories</option>
          <option value="Bug">Bug</option>
          <option value="Feature Request">Feature Request</option>
          <option value="Support">Support</option>
          <option value="General Inquiry">General Inquiry</option>
        </select>
        <button id="refresh-btn" class="btn btn-secondary btn-icon" title="Refresh List">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </section>

    <!-- Ticket List Container -->
    <main class="tickets-container">
      <div id="tickets-grid" class="tickets-grid">
        <!-- Rendered dynamically -->
      </div>
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">📂</div>
        <h3>No Tickets Found</h3>
        <p>There are currently no tickets matching your filter criteria.</p>
        <button class="btn btn-primary btn-sm" id="empty-create-btn">Create Your First Ticket</button>
      </div>
    </main>
  </div>

  <!-- Create Ticket Modal -->
  <div class="modal-overlay hidden" id="ticket-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Create New Ticket</h2>
        <button class="btn-close" id="close-modal-btn">&times;</button>
      </div>
      <form id="create-ticket-form">
        <div class="form-group">
          <label for="title">Ticket Title <span class="required">*</span></label>
          <input type="text" id="title" name="title" placeholder="Brief summary of the issue..." required minlength="3" maxlength="100">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority" required>
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="Support" selected>Support</option>
              <option value="Bug">Bug</option>
              <option value="Feature Request">Feature Request</option>
              <option value="General Inquiry">General Inquiry</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="created_by">Submitter Name</label>
          <input type="text" id="created_by" name="created_by" placeholder="e.g. Jane Doe" maxlength="50">
        </div>

        <div class="form-group">
          <label for="description">Description <span class="required">*</span></label>
          <textarea id="description" name="description" rows="4" placeholder="Provide full details about the ticket..." required minlength="5" maxlength="1000"></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-ticket-btn">Submit Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/app.js"></script>
</body>
</html>
